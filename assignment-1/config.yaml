# Every reported experiment. `defaults` apply to all trained experiments; each entry overrides them.
# Run:  uv run python scripts/run.py --only <name,...> | --family cnn|vit|ssl | --all

data:
  dir: data/raw
  cache: cache
  tile_mm: 48          # physical side of one tile (see README "Tile size")
  out_px: 224          # -> 4.67 px/mm, the native density of the training photos (only downsampling)
  overlap: 0.5
  roi: 0.7             # central 70% of each side (drops tray rim and the LED strip in Samsung photos)
  max_tiles: 48        # per photo, main cache
  extra_ppm: {}        # px/mm for cameras missing from ppm_updated.csv (none; Samsung was checked by calibrate.py)
  folds: 6
  fold_seed: 0
  tile_mm_ablation: [24, 96]
robustness:            # extra caches of the training photos, max 12 tiles per photo
  max_tiles: 12
  ppm_error: [0.5, 0.71, 1.41, 2.0]    # mis-calibrated scale
  resolution: [0.5, 0.25]              # same scale, fewer pixels per mm (correct ppm)

defaults:
  batch: 32
  steps: 600
  opt: adamw
  lr: 3.0e-4
  wd: 0.05
  warmup: 0.1
  sched: cosine
  aug: basic
  sampler: by_sample
  norm: default
  mode: ft
  drop_path: 0.0
  no_wd_norm_bias: true
  seed: 0

experiments:
  # ---------------- Part 1: CNNs ----------------
  cnn_r18_adamw:        {family: cnn, arch: resnet18.tv_in1k}
  cnn_r18_sgd:          {family: cnn, arch: resnet18.tv_in1k, opt: sgd, lr: 0.01, wd: 1.0e-4}
  cnn_r18_const_nowarm: {family: cnn, arch: resnet18.tv_in1k, warmup: 0.0, sched: constant}
  cnn_r18_frozenbn:     {family: cnn, arch: resnet18.tv_in1k, norm: frozen_bn}
  cnn_r18_groupnorm:    {family: cnn, arch: resnet18.tv_in1k, norm: groupnorm}
  cnn_r18_bs8_grouped:  {family: cnn, arch: resnet18.tv_in1k, batch: 8, steps: 2400, sampler: grouped, groups: 2}
  cnn_r18_bs8_grouped_frozenbn: {family: cnn, arch: resnet18.tv_in1k, batch: 8, steps: 2400, sampler: grouped, groups: 2, norm: frozen_bn}
  cnn_r18_noaug:        {family: cnn, arch: resnet18.tv_in1k, aug: none}
  cnn_r18_strongaug:    {family: cnn, arch: resnet18.tv_in1k, aug: strong}
  cnn_r18_tile24mm:     {family: cnn, arch: resnet18.tv_in1k, tile_mm: 24}
  cnn_r18_tile96mm:     {family: cnn, arch: resnet18.tv_in1k, tile_mm: 96}
  cnn_r18_img112:       {family: cnn, arch: resnet18.tv_in1k, img: 112}
  cnn_r50_adamw:        {family: cnn, arch: resnet50.a1_in1k}
  cnn_effb0_adamw:      {family: cnn, arch: efficientnet_b0.ra_in1k}
  cnn_convnext_t_adamw: {family: cnn, arch: convnext_tiny.fb_in22k_ft_in1k, lr: 1.0e-4, drop_path: 0.1}
  cnn_convnext_t_sgd:   {family: cnn, arch: convnext_tiny.fb_in22k_ft_in1k, opt: sgd, lr: 0.01, wd: 1.0e-4, drop_path: 0.1}

  # ---------------- Part 2: ViTs ----------------
  vit_scratch:          {family: vit, arch: tiny_vit, pretrained: false, lr: 5.0e-4, steps: 1500,
                         arch_kwargs: {img: 224, patch: 16, dim: 192, depth: 6, heads: 3, drop_path: 0.1}}
  vit_deit_s:           {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.1}
  vit_deit_s_nollrd:    {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, drop_path: 0.1}
  vit_deit_s_nowarm:    {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.1, warmup: 0.0}
  vit_deit_s_sgd:       {family: vit, arch: deit_small_patch16_224.fb_in1k, opt: sgd, lr: 0.01, wd: 1.0e-4, layer_decay: 0.75, drop_path: 0.1}
  vit_deit_s_wd_all:    {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.1, no_wd_norm_bias: false, wd: 0.3}
  vit_deit_s_dp0:       {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.0}
  vit_deit_s_img112:    {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.1, img: 112}
  vit_deit_s_strongaug: {family: vit, arch: deit_small_patch16_224.fb_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.1, aug: strong}
  vit_swin_t:           {family: vit, arch: swin_tiny_patch4_window7_224.ms_in22k_ft_in1k, lr: 1.0e-4, layer_decay: 0.75, drop_path: 0.1}
  vit_maxvit_t:         {family: vit, arch: maxvit_tiny_tf_224.in1k, lr: 1.0e-4, drop_path: 0.1}

  # ---------------- Part 3: self-supervised encoders ----------------
  # frozen features (k-NN / ridge on 5 feature sets / linear probe) -> one result per head x feature set
  frz_dinov2_s:  {family: ssl, type: frozen, arch: vit_small_patch14_dinov2.lvd142m}
  frz_dinov3_s:  {family: ssl, type: frozen, arch: vit_small_patch16_dinov3.lvd1689m}
  frz_deit_s:    {family: ssl, type: frozen, arch: deit_small_patch16_224.fb_in1k}   # supervised reference
  # tuning strategies
  ssl_dinov2_s_lpft: {family: ssl, arch: vit_small_patch14_dinov2.lvd142m, mode: lpft, lp_steps: 300, lr: 2.0e-5, layer_decay: 0.75, drop_path: 0.1}
  ssl_dinov2_s_ft:   {family: ssl, arch: vit_small_patch14_dinov2.lvd142m, lr: 5.0e-5, layer_decay: 0.75, drop_path: 0.1}
  ssl_dinov2_s_lora: {family: ssl, arch: vit_small_patch14_dinov2.lvd142m, mode: lora, lr: 1.0e-3, wd: 0.0, lora_r: 8}
  ssl_dinov3_s_lpft: {family: ssl, arch: vit_small_patch16_dinov3.lvd1689m, mode: lpft, lp_steps: 300, lr: 2.0e-5, layer_decay: 0.75, drop_path: 0.1}
  ssl_dinov3_s_ft:   {family: ssl, arch: vit_small_patch16_dinov3.lvd1689m, lr: 5.0e-5, layer_decay: 0.75, drop_path: 0.1}
  ssl_dinov3_s_lora: {family: ssl, arch: vit_small_patch16_dinov3.lvd1689m, mode: lora, lr: 1.0e-3, wd: 0.0, lora_r: 8}
  # domain adaptation: continued DINO on unlabelled training tiles, then the same comparison
  da_dinov2_s:       {family: ssl, type: dino, arch: vit_small_patch14_dinov2.lvd142m, dynamic_img_size: true,
                      steps: 2000, batch: 64, lr: 2.0e-5, head_lr: 5.0e-4, head_warmup: 200, local_px: 98, n_local: 4,
                      momentum: 0.996, teacher_temp: 0.04, probe_every: 500}
  frz_dinov2_s_da:   {family: ssl, type: frozen, arch: vit_small_patch14_dinov2.lvd142m, init_ckpt: checkpoints/da_dinov2_s/backbone.pt}
  ssl_dinov2_s_da_lpft: {family: ssl, arch: vit_small_patch14_dinov2.lvd142m, init_ckpt: checkpoints/da_dinov2_s/backbone.pt, mode: lpft, lp_steps: 300, lr: 2.0e-5, layer_decay: 0.75, drop_path: 0.1}
  ssl_dinov2_s_da_lora: {family: ssl, arch: vit_small_patch14_dinov2.lvd142m, init_ckpt: checkpoints/da_dinov2_s/backbone.pt, mode: lora, lr: 1.0e-3, wd: 0.0, lora_r: 8}
